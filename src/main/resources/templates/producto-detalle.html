<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle del producto')}"></head>
<body>
<div th:replace="~{fragments/header :: header(${currentPage})}"></div>

<main class="page-shell">
    <section class="section-shell detail-shell">
        <div class="container detail-grid">
            <div class="detail-image-panel">
                <img th:src="@{'/images/productos/' + ${producto.imagen}}" th:alt="${producto.nombre}">
            </div>

            <div class="detail-copy">
                <p class="eyebrow" th:text="${producto.categoria.nombre}">Categoría</p>
                <h1 th:text="${producto.nombre}">Producto</h1>
                <p class="detail-price" th:text="${#numbers.formatCurrency(producto.precio)}">$12.99</p>
                <p class="detail-description" th:text="${producto.descripcion}">Descripción</p>

                <div class="detail-status">
                    <span th:classappend="${producto.disponible} ? ' stock-ok' : ' stock-low'"
                          th:text="${producto.disponible} ? 'Disponible para pedido' : 'Agotado por ahora'">
                        Disponible para pedido
                    </span>
                    <span th:text="'Unidades en stock: ' + ${producto.stock}">Unidades en stock: 20</span>
                </div>

                <div class="detail-actions">
                    <button class="button button-primary add-to-cart"
                            type="button"
                            th:disabled="${!producto.disponible}"
                            th:data-product-name="${producto.nombre}">
                        Agregar al carrito
                    </button>
                    <a class="button button-secondary"
                       th:if="${producto.disponible}"
                       th:href="@{'/pedido?productoId=' + ${producto.id}}">
                        Solicitar ahora
                    </a>
                    <a class="button button-secondary"
                       th:unless="${producto.disponible}"
                       th:href="@{/catalogo}">
                        Volver al catálogo
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div class="toast" id="toast" aria-live="polite" aria-hidden="true"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
