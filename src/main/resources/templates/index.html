<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inicio')}"></head>
<body>
<div th:replace="~{fragments/header :: header(${currentPage})}"></div>

<main>
    <section class="hero">
        <div class="container hero-grid">
            <div class="hero-copy">
                <p class="eyebrow">Comercio electrónico local</p>
                <h1>Compra productos esenciales con una experiencia web clara, rápida y responsiva.</h1>
                <p class="hero-text">
                    Explora un catálogo organizado por categorías, revisa la ficha de cada producto
                    y crea un pedido de prueba respaldado por PostgreSQL.
                </p>
                <div class="hero-actions">
                    <a class="button button-primary" th:href="@{/catalogo}">Ver catálogo</a>
                    <a class="button button-secondary" th:href="@{/pedido}">Simular pedido</a>
                </div>
            </div>

            <div class="hero-visual">
                <img th:src="@{/images/brand/hero.svg}" alt="Ilustración de compras en línea para Tienda Web Express">
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div class="toast" id="toast" aria-live="polite" aria-hidden="true"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
