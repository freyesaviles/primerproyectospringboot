<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Producto no encontrado')}"></head>
<body>
<div th:replace="~{fragments/header :: header(${currentPage})}"></div>

<main class="page-shell">
    <section class="section-shell">
        <div class="container empty-state not-found-card">
            <p class="eyebrow">Error 404</p>
            <h1>El producto que buscas no está disponible</h1>
            <p th:text="${message}">No se encontró el producto solicitado.</p>
            <div class="detail-actions">
                <a class="button button-primary" th:href="@{/catalogo}">Volver al catálogo</a>
                <a class="button button-secondary" th:href="@{/}">Ir al inicio</a>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div class="toast" id="toast" aria-live="polite" aria-hidden="true"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
